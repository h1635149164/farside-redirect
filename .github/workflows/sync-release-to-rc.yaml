name: Sync Release to RC

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Release into RC and Push
        run: |
          git checkout rc
          git merge origin/release -m "Merge ${{ github.sha }}@release into rc"
          git push origin rc