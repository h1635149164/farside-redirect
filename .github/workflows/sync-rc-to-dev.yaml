name: Sync RC to Dev

on:
  push:
    branches:
      - rc

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge RC into Dev and Push
        run: |
          git checkout dev
          git merge origin/rc -m "Merge ${{ github.sha }}@rc into dev"
          git push origin dev
