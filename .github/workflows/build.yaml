
name: Build

on:
  push:
    branches:
      - release
      - rc
      - dev
    paths:
      - 'src/**'
  pull_request:
    branches:
      - release
      - rc
      - dev
    paths:
      - 'src/**'

jobs:
  build-firefox:
    name: Lint & Build (Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Setup Firefox Manifest
        run: node scripts/utility/merge.js src/manifest.common.json src/manifest.firefox.json src/manifest.json

      - name: Lint extension
        id: lint
        run: node scripts/utility/lint.js firefox

      - name: Build extension
        id: build
        run: |
          TMP=$(mktemp -d)
          npx web-ext build \
            --source-dir    ./src \
            --artifacts-dir "$TMP" \
            --overwrite-dest \
            --no-input \
            --ignore-files manifest.firefox.json manifest.chrome.json manifest.common.json
          mkdir -p ./dist
          unzip "$TMP"/*.zip -d ./dist
          rm -rf "$TMP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firefox-extension
          path: dist/

      - name: Clean up manifest
        if: always()
        run: rm -f src/manifest.json

      - name: Update lint badge (Gist endpoint)
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}
        run: |
          ERRORS="${{ steps.lint.outputs.errors }}"
          WARNINGS="${{ steps.lint.outputs.warnings }}"
          NOTICES="${{ steps.lint.outputs.notices }}"
          BUILD_OUTCOME="${{ steps.build.outcome }}"
          BRANCH="${GITHUB_REF_NAME:-unknown}"

          # ── Determine badge colour & message ──
          if   [ "$BUILD_OUTCOME" = "failure" ]; then
            COLOR="critical";     MSG="build failed"
          elif [ -z "$ERRORS" ]; then
            COLOR="critical";     MSG="lint failed"
          elif [ "$ERRORS"   -gt 0 ]; then
            COLOR="critical";     MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          elif [ "$WARNINGS" -gt 0 ]; then
            COLOR="yellow";       MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          elif [ "$NOTICES"  -gt 0 ]; then
            COLOR="informational";MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          else
            COLOR="brightgreen";  MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          fi

          VERSION=$(jq -r '.version' src/manifest.common.json)
          PAYLOAD=$(jq -n \
            --arg msg   "$MSG" \
            --arg color "$COLOR" \
            --arg ver   "v$VERSION" \
            '{schemaVersion: 1, label: $ver, message: $msg, color: $color}')

          FILENAME="firefox-${BRANCH}-lint.json"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              --data "$(jq -n \
                --arg f "$FILENAME" \
                --arg c "$PAYLOAD"  \
                '{files: {($f): {content: $c}}}')" \
              "https://api.github.com/gists/$GIST_ID")
            echo "Gist update → HTTP $HTTP  (file: $FILENAME)"
          else
            echo "⚠️  GIST_TOKEN / GIST_ID not configured — badge update skipped"
            echo "    (This is expected for offline / act runs)"
            echo "    Badge payload: $PAYLOAD"
          fi

  build-chrome:
    name: Lint & Build (Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ext
        run: npm install --global web-ext

      - name: Setup Chrome Manifest
        run: node scripts/utility/merge.js src/manifest.common.json src/manifest.chrome.json src/manifest.json

      - name: Lint extension
        id: lint
        run: node scripts/utility/lint.js chrome

      - name: Build extension
        id: build
        run: |
          TMP=$(mktemp -d)
          npx web-ext build \
            --source-dir    ./src \
            --artifacts-dir "$TMP" \
            --overwrite-dest \
            --no-input \
            --ignore-files manifest.firefox.json manifest.chrome.json manifest.common.json
          mkdir -p ./dist
          unzip "$TMP"/*.zip -d ./dist
          rm -rf "$TMP"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/

      - name: Clean up manifest
        if: always()
        run: rm -f src/manifest.json

      - name: Update lint badge (Gist endpoint)
        if: always()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID:    ${{ secrets.GIST_ID }}
        run: |
          ERRORS="${{ steps.lint.outputs.errors }}"
          WARNINGS="${{ steps.lint.outputs.warnings }}"
          NOTICES="${{ steps.lint.outputs.notices }}"
          BUILD_OUTCOME="${{ steps.build.outcome }}"
          BRANCH="${GITHUB_REF_NAME:-unknown}"

          # ── Determine badge colour & message ──
          if   [ "$BUILD_OUTCOME" = "failure" ]; then
            COLOR="critical";     MSG="build failed"
          elif [ -z "$ERRORS" ]; then
            COLOR="critical";     MSG="lint failed"
          elif [ "$ERRORS"   -gt 0 ]; then
            COLOR="critical";     MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          elif [ "$WARNINGS" -gt 0 ]; then
            COLOR="yellow";       MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          elif [ "$NOTICES"  -gt 0 ]; then
            COLOR="informational";MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          else
            COLOR="brightgreen";  MSG="${ERRORS}|${WARNINGS}|${NOTICES}"
          fi

          VERSION=$(jq -r '.version' src/manifest.common.json)
          PAYLOAD=$(jq -n \
            --arg msg   "$MSG" \
            --arg color "$COLOR" \
            --arg ver   "v$VERSION" \
            '{schemaVersion: 1, label: $ver, message: $msg, color: $color}')

          FILENAME="chrome-${BRANCH}-lint.json"

          if [ -n "$GIST_TOKEN" ] && [ -n "$GIST_ID" ]; then
            HTTP=$(curl -s -o /dev/null -w "%{http_code}" -X PATCH \
              -H "Authorization: token $GIST_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              --data "$(jq -n \
                --arg f "$FILENAME" \
                --arg c "$PAYLOAD"  \
                '{files: {($f): {content: $c}}}')" \
              "https://api.github.com/gists/$GIST_ID")
            echo "Gist update → HTTP $HTTP  (file: $FILENAME)"
          else
            echo "⚠️  GIST_TOKEN / GIST_ID not configured — badge update skipped"
            echo "    (This is expected for offline / act runs)"
            echo "    Badge payload: $PAYLOAD"
          fi
