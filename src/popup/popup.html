<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Farside Redirects</h1>
    </header>
    
    <main>
      <div id="services-list">
        <p class="loading">Loading configuration...</p>
      </div>
      <p id="no-matches" class="error" style="display: none;">No services match your search.</p>
    </main>

    <footer>
      <div class="footer-controls">
        <input type="text" id="search-input" placeholder="Search services..." />
        <label class="global-toggle-label" title="Enable/Disable all redirects">
          <input type="checkbox" id="global-toggle" class="global-toggle" />
          <span class="slider"></span>
        </label>
      </div>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
